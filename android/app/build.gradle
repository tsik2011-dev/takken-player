plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.tsik2011dev.takken'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.tsik2011dev.takken'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('../release.keystore')
            storePassword 'takkenplayer'
            keyAlias 'takken'
            keyPassword 'takkenplayer'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
